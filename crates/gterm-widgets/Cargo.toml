[package]
name = "gterm-widgets"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Immediate-mode widgets and controls for gterm"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gterm = { path = "../gterm", version = "0.1" }
bitflags = "2"
# Сообщения ввода несут типы `winit` без перевода (ADR-0004, ADR-0026); фичи те же, что у `gterm`,
# новых транзитивных зависимостей нет.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
arboard = { version = "3.7", default-features = false, optional = true }
# Разбор тем формата helix (ADR-0037): только разборщик, без `serde`.
toml = { version = "1.2", default-features = false, features = ["std", "parse"], optional = true }

# Экран из виджетов на системном шрифте (ADR-0023). Запуск из корня workspace:
# `cargo run -p gterm-widgets --example widgets`.
[[example]]
name = "widgets"
path = "examples/widgets.rs"

# Форма: поля ввода, выпадающий список, кнопки (ADR-0027), системный буфер обмена (ADR-0030),
# темы из файлов (ADR-0037).
# Запуск из корня workspace: `cargo run -p gterm-widgets --example widget_edit`.
[[example]]
name = "widget_edit"
path = "examples/widget_edit.rs"
required-features = ["system-clipboard", "theme-toml"]

# Просмотр тем (ADR-0037): перечень тем каталогов, элементы темы в своих стилях, образец
# интерфейса и диалоговые окна; в полях — системный буфер обмена (ADR-0030).
# Запуск из корня workspace: `cargo run -p gterm-widgets --example theme`.
[[example]]
name = "theme"
path = "examples/theme/main.rs"
required-features = ["system-clipboard", "theme-toml"]

[features]
default = ["system-clipboard", "theme-toml"]
# Системный буфер обмена `SystemClipboard` (ADR-0030); без фичи остаются трейт `Clipboard` и
# `MemoryClipboard`.
system-clipboard = ["dep:arboard"]
# Загрузка тем из TOML (`Theme::load`, `Theme::from_toml_str`, ADR-0037); без фичи остаются
# `Theme`, сборка темы в коде и встроенная тема.
theme-toml = ["dep:toml"]
