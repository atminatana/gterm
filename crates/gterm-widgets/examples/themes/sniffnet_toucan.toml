# Тема sniffnet «toucan» в формате helix для gterm-widgets (ADR-0038).
# Источник: resources/themes/toucan.toml (sniffnet 1.6.0, MIT OR Apache-2.0) — см. README.md каталога.
# Заданы только области основы; тона (ui.control*, ui.selection, …) и области виджетов
# выводятся из них. Любую из них можно задать здесь строкой — она заменит выведенную.

"ui.background" = { bg = "primary" }
"ui.text" = "text_body"
"ui.accent" = { fg = "text_headers", bg = "secondary" }

[palette]
primary = "#000000"       # фон
secondary = "#FF8000"     # акцент: шапка, рамки, входящие соединения
outgoing = "#FFFFFF"      # второй акцент: исходящие соединения
text_body = "#33FF33"     # текст на фоне
text_headers = "#232634"  # текст на акценте
starred = "#FFFF00"       # звёздочка избранного
