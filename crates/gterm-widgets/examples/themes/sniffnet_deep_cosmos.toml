# Тема sniffnet «deep_cosmos» в формате helix для gterm-widgets (ADR-0038).
# Источник: resources/themes/deep_cosmos.toml (sniffnet 1.6.0, MIT OR Apache-2.0) — см. README.md каталога.
# Заданы только области основы; тона (ui.control*, ui.selection, …) и области виджетов
# выводятся из них. Любую из них можно задать здесь строкой — она заменит выведенную.

"ui.background" = { bg = "primary" }
"ui.text" = "text_body"
"ui.accent" = { fg = "text_headers", bg = "secondary" }

[palette]
primary = "#150B37"       # фон
secondary = "#8C19FF"     # акцент: шапка, рамки, входящие соединения
outgoing = "#1061EB"      # второй акцент: исходящие соединения
text_body = "#BEDDFF"     # текст на фоне
text_headers = "#150B37"  # текст на акценте
starred = "#FF8000"       # звёздочка избранного
