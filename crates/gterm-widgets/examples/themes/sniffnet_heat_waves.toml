# Тема sniffnet «heat_waves» в формате helix для gterm-widgets (ADR-0038).
# Источник: resources/themes/heat_waves.toml (sniffnet 1.6.0, MIT OR Apache-2.0) — см. README.md каталога.
# Заданы только области основы; тона (ui.control*, ui.selection, …) и области виджетов
# выводятся из них. Любую из них можно задать здесь строкой — она заменит выведенную.

"ui.background" = { bg = "primary" }
"ui.text" = "text_body"
"ui.accent" = { fg = "text_headers", bg = "secondary" }

[palette]
primary = "#F5E0E0"       # фон
secondary = "#C80036"     # акцент: шапка, рамки, входящие соединения
outgoing = "#FF8225"      # второй акцент: исходящие соединения
text_body = "#0C1844"     # текст на фоне
text_headers = "#FFF5E1"  # текст на акценте
starred = "#FFAF45"       # звёздочка избранного
