# Тема sniffnet «yeti_dark» в формате helix для gterm-widgets (ADR-0038).
# Источник: src/gui/styles/custom_themes/yeti.rs (sniffnet 1.6.0, MIT OR Apache-2.0) — см. README.md каталога.
# Заданы только области основы; тона (ui.control*, ui.selection, …) и области виджетов
# выводятся из них. Любую из них можно задать здесь строкой — она заменит выведенную.

"ui.background" = { bg = "primary" }
"ui.text" = "text_body"
"ui.accent" = { fg = "text_headers", bg = "secondary" }

[palette]
primary = "#282828"       # фон
secondary = "#B35900"     # акцент: шапка, рамки, входящие соединения
outgoing = "#0059B3"      # второй акцент: исходящие соединения
text_body = "#FFFFFF"     # текст на фоне
text_headers = "#000000"  # текст на акценте
starred = "#F5C127"       # звёздочка избранного
