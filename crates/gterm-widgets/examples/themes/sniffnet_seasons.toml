# Тема sniffnet «seasons» в формате helix для gterm-widgets (ADR-0038).
# Источник: resources/themes/seasons.toml (sniffnet 1.6.0, MIT OR Apache-2.0) — см. README.md каталога.
# Заданы только области основы; тона (ui.control*, ui.selection, …) и области виджетов
# выводятся из них. Любую из них можно задать здесь строкой — она заменит выведенную.

"ui.background" = { bg = "primary" }
"ui.text" = "text_body"
"ui.accent" = { fg = "text_headers", bg = "secondary" }

[palette]
primary = "#CCE5FF"       # фон
secondary = "#B25900"     # акцент: шапка, рамки, входящие соединения
outgoing = "#218924"      # второй акцент: исходящие соединения
text_body = "#043A00"     # текст на фоне
text_headers = "#232634"  # текст на акценте
starred = "#CD981B"       # звёздочка избранного
