# Тема sniffnet «gruvbox_light» в формате helix для gterm-widgets (ADR-0038).
# Источник: src/gui/styles/custom_themes/gruvbox.rs (sniffnet 1.6.0, MIT OR Apache-2.0) — см. README.md каталога.
# Заданы только области основы; тона (ui.control*, ui.selection, …) и области виджетов
# выводятся из них. Любую из них можно задать здесь строкой — она заменит выведенную.

"ui.background" = { bg = "primary" }
"ui.text" = "text_body"
"ui.accent" = { fg = "text_headers", bg = "secondary" }

[palette]
primary = "#FBF1C7"       # фон
secondary = "#D65D0E"     # акцент: шапка, рамки, входящие соединения
outgoing = "#689D6A"      # второй акцент: исходящие соединения
text_body = "#282828"     # текст на фоне
text_headers = "#F9F5D7"  # текст на акценте
starred = "#D79921"       # звёздочка избранного
