# Тема sniffnet «catppuccin» в формате helix для gterm-widgets (ADR-0038).
# Источник: resources/themes/catppuccin.toml (sniffnet 1.6.0, MIT OR Apache-2.0) — см. README.md каталога.
# Заданы только области основы; тона (ui.control*, ui.selection, …) и области виджетов
# выводятся из них. Любую из них можно задать здесь строкой — она заменит выведенную.

"ui.background" = { bg = "primary" }
"ui.text" = "text_body"
"ui.accent" = { fg = "text_headers", bg = "secondary" }

[palette]
primary = "#303446"       # фон
secondary = "#A6D189"     # акцент: шапка, рамки, входящие соединения
outgoing = "#F4B8E4"      # второй акцент: исходящие соединения
text_body = "#C6D0F5"     # текст на фоне
text_headers = "#232634"  # текст на акценте
starred = "#E5C890"       # звёздочка избранного
